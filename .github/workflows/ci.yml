name: IPO Tracker CI

on:
  push:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=ipo_tracker_test
          POSTGRES_USER=ipo_test
          POSTGRES_PASSWORD=ipo_test_password
          BACKEND_PORT=5000
          FRONTEND_URL=http://localhost
          REACT_APP_API_URL=http://localhost/api
          FRONTEND_PORT=3000
          EOF

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Run backend tests
        run: docker compose run --rm backend-test

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        id: lowercase
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ipo_tracker/backend:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ipo_tracker/backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ipo_tracker/frontend:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ipo_tracker/frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build

    environment:
      name: production

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::821267251423:role/GitHubActions-IPOTacker-Deploy
          aws-region: ap-south-1

      - name: Deploy to EC2 via SSM
        env:
          EC2_INSTANCE_ID: i-0da37629072ec5d0c
          IMAGE_TAG: ${{ github.sha }}
        run: |

          set -e

          echo "========================================="
          echo "Starting SSM deployment"
          echo "========================================="

          echo "Deployment tag: $IMAGE_TAG"

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"sudo -u ubuntu -H bash -c '/home/ubuntu/ipo-tracker/deploy.sh $IMAGE_TAG'\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment to finish..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          echo "Retrieving deployment output..."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "========================================="
          echo "SSM deployment status: $STATUS"
          echo "========================================="

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            exit 1
          fi

          echo "Deployment completed successfully."