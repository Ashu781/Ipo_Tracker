name: IPO Tracker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=ipo_tracker_test
          POSTGRES_USER=ipo_test
          POSTGRES_PASSWORD=ipo_test_password
          BACKEND_PORT=5000
          FRONTEND_URL=http://localhost
          REACT_APP_API_URL=http://localhost/api
          FRONTEND_PORT=3000
          EOF

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Run backend tests
        run: docker compose run --rm backend-test

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        id: lowercase
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ipo_tracker/backend:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ipo_tracker/backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ipo_tracker/frontend:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ipo_tracker/frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/ipo-tracker

            export IMAGE_TAG=${{ github.sha }}

            echo "Deploying image tag: $IMAGE_TAG"

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d

            echo "Deployment completed successfully"

            docker compose -f docker-compose.prod.yml ps