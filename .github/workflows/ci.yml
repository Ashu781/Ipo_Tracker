name: IPO Tracker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=ipo_tracker_test
          POSTGRES_USER=ipo_test
          POSTGRES_PASSWORD=ipo_test_password
          BACKEND_PORT=5000
          FRONTEND_URL=http://localhost
          REACT_APP_API_URL=http://localhost/api
          FRONTEND_PORT=3000
          EOF

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Run backend tests
        run: docker compose run --rm backend-test

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ipo-tracker-backend ./backend

      - name: Build frontend image
        run: docker build -t ipo-tracker-frontend ./frontend