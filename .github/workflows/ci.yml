name: IPO Tracker CI

on:
  push:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=ipo_tracker_test
          POSTGRES_USER=ipo_test
          POSTGRES_PASSWORD=ipo_test_password
          BACKEND_PORT=5000
          FRONTEND_URL=http://localhost
          REACT_APP_API_URL=http://localhost/api
          FRONTEND_PORT=3000
          EOF

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Run backend tests
        run: docker compose run --rm backend-test

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        id: lowercase
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ipo_tracker/backend:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ipo_tracker/backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ipo_tracker/frontend:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ipo_tracker/frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/ipo-tracker

            NEW_TAG=${{ github.sha }}

            echo "New deployment tag: $NEW_TAG"

            echo "Detecting currently running backend image..."

            PREVIOUS_IMAGE=$(docker inspect ipo-tracker-backend \
              --format '{{.Config.Image}}')

            PREVIOUS_TAG=$(echo "$PREVIOUS_IMAGE" | cut -d: -f2)

            echo "Previous deployment tag: $PREVIOUS_TAG"

            echo "Pulling new images..."

            export IMAGE_TAG=$NEW_TAG

            docker compose -f docker-compose.prod.yml pull

            echo "Deploying new version..."

            docker compose -f docker-compose.prod.yml up -d

            echo "Waiting for backend to become healthy..."

            HEALTHY=false

            for i in {1..30}; do
              STATUS=$(docker inspect \
                --format='{{.State.Health.Status}}' \
                ipo-tracker-backend 2>/dev/null || echo "missing")

              if [ "$STATUS" = "healthy" ]; then
                echo "Backend is healthy."
                HEALTHY=true
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "Backend is unhealthy."
                break
              fi

              echo "Backend status: $STATUS"
              sleep 2
            done

            if [ "$HEALTHY" = true ]; then

              echo "Checking public website..."

              HTTP_STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" https://ashuweb.online)

              if [ "$HTTP_STATUS" = "200" ]; then
                echo "Website is healthy. HTTP status: $HTTP_STATUS"
                echo "Deployment completed successfully."
                docker compose -f docker-compose.prod.yml ps
                exit 0
              fi

              echo "Website health check failed. HTTP status: $HTTP_STATUS"

            else

              echo "Backend health check failed."

            fi

            echo "========================================="
            echo "DEPLOYMENT FAILED"
            echo "Starting automatic rollback..."
            echo "========================================="

            echo "Rolling back to: $PREVIOUS_TAG"

            export IMAGE_TAG=$PREVIOUS_TAG

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d

            echo "Waiting for rollback backend to become healthy..."

            ROLLBACK_HEALTHY=false

            for i in {1..30}; do
              STATUS=$(docker inspect \
                --format='{{.State.Health.Status}}' \
                ipo-tracker-backend 2>/dev/null || echo "missing")

              if [ "$STATUS" = "healthy" ]; then
                echo "Rollback backend is healthy."
                ROLLBACK_HEALTHY=true
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "Rollback backend is unhealthy."
                break
              fi

              echo "Rollback backend status: $STATUS"
              sleep 2
            done

            if [ "$ROLLBACK_HEALTHY" = true ]; then

              echo "Checking website after rollback..."

              HTTP_STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" https://ashuweb.online)

              if [ "$HTTP_STATUS" = "200" ]; then
                echo "Rollback successful."
                echo "Previous version $PREVIOUS_TAG has been restored."
                docker compose -f docker-compose.prod.yml ps
                exit 1
              fi

              echo "Rollback website check failed. HTTP status: $HTTP_STATUS"

            else

              echo "Rollback backend health check failed."

            fi

            echo "CRITICAL: Automatic rollback failed."
            echo "Production may require manual intervention."
            docker compose -f docker-compose.prod.yml ps
            exit 1

  oidc-test:
    name: Inspect AWS OIDC
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Inspect OIDC claims
        run: |
          TOKEN_JSON=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          echo "$ID_TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .