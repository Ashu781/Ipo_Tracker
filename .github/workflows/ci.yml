name: IPO Tracker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=ipo_tracker_test
          POSTGRES_USER=ipo_test
          POSTGRES_PASSWORD=ipo_test_password
          BACKEND_PORT=5000
          FRONTEND_URL=http://localhost
          REACT_APP_API_URL=http://localhost/api
          FRONTEND_PORT=3000
          EOF

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Run backend tests
        run: docker compose run --rm backend-test

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ipo_tracker/backend:latest
            ghcr.io/${{ github.repository_owner }}/ipo_tracker/backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ipo_tracker/frontend:latest
            ghcr.io/${{ github.repository_owner }}/ipo_tracker/frontend:${{ github.sha }}