services:
  postgres:
    image: postgres:16-alpine
    container_name: ipo-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ipo_tracker
      POSTGRES_USER: ipo_user
      POSTGRES_PASSWORD: ipo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipo_user -d ipo_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
